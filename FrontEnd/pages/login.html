
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta
        name="description"
        content="Login to your Workonnect account."
        >
        <title>Login | Workonnect</title>
        <link rel="stylesheet" href="../assets/css/auth.css">
    </head>
    <body>
        <main class="auth-page">
            <div class="auth-decoration decoration-one">
            </div>
            <div class="auth-decoration decoration-two">
            </div>
            <div class="auth-grid">
            </div>
                 <section class="auth-wrapper">
                  
                        <a href="../index.html" class="auth-brand">
                            <span class="brand-mark">
                                W
                            </span>
                            <span class="brand-name">
                                Work<span>onnect</span>
                            </span>
                        </a>
                        <div class="auth-card">
                            <div class="auth-card-header">
                                <!-- <div class="auth-icon">
                                    ↗
                                </div> -->
                            <span class="auth-label">
                                    WELCOME BACK
                                </span>
                                <h1>
                                    Welcome back.
                                </h1>
                                <p>
                                    Sign in to continue to Workonnect.
                                </p>
                            </div>
                          
                            <!-- ONLY ONE FORM -->
                            <form
                                action="../../BackEnd/login.php"
                                method="POST"
                                class="auth-form"
                                id="loginForm"
                            >
                            <div class="form-group">
                                <label for="loginEmail">
                                    Email address
                                </label>
                                <div class="input-wrapper">
                                    <span class="input-icon">
                                        @
                                    </span>
                                    <input
                                    type="email"
                                    id="loginEmail"
                                    name="email"
                                    placeholder="Enter your email"
                                    autocomplete="email"
                                    required
                                    >
                                </div>
                                <small
                                class="field-error"
                                id="loginEmailError"
                                >
                            </small>
                        </div>
                        <div class="form-group">
                            <div class="label-row">
                                <label for="loginPassword">
                                    Password
                                </label>
                                <a
                                href="forget_password.html"
                                class="forgot-link"
                                >
                                Forgot password?
                            </a>
                        </div>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                •••
                            </span>
                            <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                            >
                            <button
                            type="button"
                            class="password-toggle"
                            data-target="loginPassword"
                            aria-label="Show password"
                            >
                            Show
                        </button>
                    </div>
                    <small
                    class="field-error"
                    id="loginPasswordError"
                    >
                </small>
            </div>
            <label class="remember-row">
                <input
                type="checkbox"
                id="rememberMe"
                >
                <span class="custom-checkbox">
                </span>
                <span>
                    Remember me
                </span>
            </label>
            <button
            type="submit"
            class="auth-submit"
            >
            <span>Login</span>
            <span class="submit-arrow">
                ↗
            </span>
        </button>
        <div
        class="form-message"
        id="loginMessage"
        >
        </div>
    </form>
        <div class="auth-divider">
            <span>OR</span>
        </div>
        <div class="auth-footer">
            <span>
                Don't have an account?
            </span>
            <a href="register.html">
                Create Account
            </a>
        </div>
        </div>
<a
href="../index.html"
class="back-home"
>
← Back to Workonnect
</a>
</section>
</main>
<!-- <script src="../assets/js/auth.js"> -->
</script>
</body>
</html>
