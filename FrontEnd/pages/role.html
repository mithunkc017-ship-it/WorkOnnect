            </span>

            <h1>
                How will you use<br>
                <span>WorkOnnect?</span>
            </h1>

            <p>
                Choose the option that best describes you.
                You can change your profile information later.
            </p>

        </div>


        <div class="role-options">


            <!-- CUSTOMER -->

            <button
                class="role-option customer"
                onclick="selectRole('customer')"

            >

            <!-- <button

            > -->

                        />

                    </svg>

                </div>


                <div class="role-content">

                    <span class="role-small">
                        I NEED A SERVICE
                    </span>

                    <h2>
                        I'm a Customer
                    </h2>

                    <p>
                        Find trusted workers and
                        hire someone for your needs.
                    </p>

                </div>


                <div class="role-arrow">
                    →
                </div>

            </button>



            <!-- WORKER -->

            <button
                class="role-option worker"
                onclick="selectRole('worker')"
            >

                <div class="role-icon">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                    >

                        <path
                            d="M14.7 6.3a4.8 4.8 0 0 0-6.4 6.4L3 18v3h3l5.3-5.3a4.8 4.8 0 0 0 6.4-6.4l-3 3-3-3 3-3z"
                        />

                    </svg>

                </div>


                <div class="role-content">

                    <span class="role-small">
                        I OFFER A SERVICE
                    </span>

                    <h2>
                        I'm a Worker
                    </h2>

                    <p>
                        Showcase your skills,
                        find customers and earn.
                    </p>

                </div>


                <div class="role-arrow">
                    →
                </div>

            </button>


        </div>


        <div class="role-footer">

            <span class="footer-dot"></span>

            You can update your profile later.

        </div>


    </main>

</div>

function selectRole(role) {

    const selectedCard =
        document.querySelector("." + role);

    selectedCard.classList.add("selected");


    const form = document.createElement("form");

    form.method = "POST";

    form.action = "../../BackEnd/save_role.php";


    const input = document.createElement("input");

    input.type = "hidden";

    input.name = "role";

    input.value = role;


    form.appendChild(input);

    document.body.appendChild(form);


    setTimeout(function () {

        form.submit();

    }, 450);

}

</script>
