<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Customer Profile | WorkOnnect</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<link rel="stylesheet" href="../assets/css/customer-profile.css?v=1">
</head>

<body>

<div class="profile-page">

    <div class="profile-card">

        <div class="profile-brand">
            <div class="brand-logo">W</div>

            <div class="brand-name">
                Work<span>Onnect</span>
            </div>
        </div>


        <div class="profile-heading">

            <span>STEP 2 OF 2</span>

            <h1>
                Tell us about <strong>you</strong>
            </h1>

            <p>
                Help us understand what kind of services
                you're looking for.
            </p>

        </div>


        <form
            action="../../BackEnd/save_customer_profile.php"
            method="POST"
            class="profile-form"
        >

            <div class="form-group">

                <label>
                    Address
                </label>

                <input
                    type="text"
                    name="address"
                    placeholder="Enter your address"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Location
                    </label>

                    <input
                        type="text"
                        name="location"
                        placeholder="City / Area"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Required Service
                    </label>

                    <select
                        name="required_service"
                        required
                    >

                        <option value="">
                            Select a service
                        </option>

                        <option value="Cleaning">
                            Cleaning
                        </option>

                        <option value="Plumbing">
                            Plumbing
                        </option>

                        <option value="Electrical">
                            Electrical
                        </option>

                        <option value="Painting">
                            Painting
                        </option>

                        <option value="Tutoring">
                            Tutoring
                        </option>

                        <option value="Gardening">
                            Gardening
                        </option>

                        <option value="Repair">
                            Repair
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>

            </div>


            <button
                type="submit"
                class="continue-btn"
            >

                Continue

                <span>→</span>

            </button>

        </form>


        <div class="profile-footer">

            Your information is securely stored.

        </div>

    </div>

</div>

</body>

</html>
