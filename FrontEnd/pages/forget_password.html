<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
        >
        <meta
        name="description"
        content="Reset your Workonnect password."
        >
        <title>Forgot Password | Workonnect</title>
        <link rel="stylesheet" href="../assets/css/auth.css">
    </head>
    <body>
        <main class="auth-page forgot-page">
            <div class="auth-decoration decoration-one">
            </div>
            <div class="auth-decoration decoration-two">
            </div>
            <div class="auth-grid">
            </div>
            <section class="auth-wrapper">
                <a href="../index.html" class="auth-brand">
                    <span class="brand-mark">
                        W
                    </span>
                    <span class="brand-name">
                        Work<span>onnect</span>
                    </span>
                </a>
                <div class="auth-card">
                    <div class="auth-card-header">
                        <div class="auth-icon">
                            ?
                        </div>
                        <span class="auth-label">
                            ACCOUNT RECOVERY
                        </span>
                        <h1>
                            Forgot your password?
                        </h1>
                        <p>
                            Enter your email and we'll help you
                            reset your password.
                        </p>
                    </div>
                    <form
                    class="auth-form"
                    id="forgotForm"
                    novalidate
                    >
                    <div class="form-group">
                        <label for="forgotEmail">
                            Email address
                        </label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                @
                            </span>
                            <input
                            type="email"
                            id="forgotEmail"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                            >
                        </div>
                        <small
                        class="field-error"
                        id="forgotEmailError"
                        >
                    </small>
                </div>
                <button
                type="submit"
                class="auth-submit"
                >
                <span>
                    Send Reset Link
                </span>
                <span class="submit-arrow">
                    ↗
                </span>
            </button>
            <div
            class="form-message"
            id="forgotMessage"
            >
        </div>
    </form>
    <div class="auth-divider">
        <span>OR</span>
    </div>
    <div class="auth-footer">
        <a href="login.html">
            ← Back to Login
        </a>
    </div>
</div>
<a
href="../index.html"
class="back-home"
>
← Back to Workonnect
</a>
</section>
</main>
<script src="../assets/js/auth.js">
</script>
</body>
</html>
