<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
        >
        <meta
        name="description"
        content="Create your Workonnect account."
        >
        <title>Create Account | Workonnect</title>
        <link rel="stylesheet" href="../assets/css/auth.css">
    </head>
    <body>
        <main class="auth-page register-page">
            <div class="auth-decoration decoration-one">
            </div>
            <div class="auth-decoration decoration-two">
            </div>
            <div class="auth-grid">
            </div>
            <section class="auth-wrapper">
                <a href="../index.html" class="auth-brand">
                    <span class="brand-mark">
                        W
                    </span>
                    <span class="brand-name">
                        Work<span>onnect</span>
                    </span>
                </a>
                <div class="auth-card register-card">
                    <div class="auth-card-header">
                        <div class="auth-icon">
                            +
                        </div>
                        <span class="auth-label">
                            JOIN WORKONNECT
                        </span>
                        <h1>
                            Create your account.
                        </h1>
                        <p>
                            Connect with Workonnect and get started.
                        </p>
                    </div>
                    <form
                        class="auth-form"
                        id="registerForm"
                        action="../../BackEnd/register.php"
                        method="POST"
                        novalidate
                    >
                    <div class="form-group">
                        <label for="registerName">
                            Full name
                        </label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                ◎
                            </span>
                            <input
                            type="text"
                            id="registerName"
                            name="name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                            >
                        </div>
                        <small
                        class="field-error"
                        id="registerNameError"
                        >
                    </small>
                </div>
                <div class="form-group">
                    <label for="registerEmail">
                        Email address
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            @
                        </span>
                        <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                        >
                    </div>
                    <small
                    class="field-error"
                    id="registerEmailError"
                    >
                </small>
            </div>
            <div class="form-group">
                <label for="registerPassword">
                    Password
                </label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        •••
                    </span>
                    <input
                    type="password"
                    id="registerPassword"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                    >
                    <button
                    type="button"
                    class="password-toggle"
                    data-target="registerPassword"
                    aria-label="Show password"
                    >
                    Show
                </button>
            </div>
            <div
            class="password-strength"
            id="passwordStrength"
            >
            <div class="strength-bars">
                <span>
                </span>
                <span>
                </span>
                <span>
                </span>
                <span>
                </span>
            </div>
            <span class="strength-text">
                Use 8 or more characters
            </span>
        </div>
        <small
        class="field-error"
        id="registerPasswordError"
        >
    </small>
</div>
<div class="form-group">
    <label for="confirmPassword">
        Confirm password
    </label>
    <div class="input-wrapper">
        <span class="input-icon">
            •••
        </span>
        <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        placeholder="Confirm your password"
        autocomplete="new-password"
        required
        >
        <button
        type="button"
        class="password-toggle"
        data-target="confirmPassword"
        aria-label="Show password"
        >
        Show
    </button>
</div>
<small
class="field-error"
id="confirmPasswordError"
>
</small>
</div>
<label class="terms-row">
    <input
    type="checkbox"
    id="acceptTerms"
    >
    <span class="custom-checkbox">
    </span>
    <span>
        I agree to the Workonnect
        <a href="#">
            Terms
        </a>
        and
        <a href="#">
            Privacy Policy
        </a>.
    </span>
</label>
<button
type="submit"
class="auth-submit"
>
<span>Create Account</span>
<span class="submit-arrow">
    ↗
</span>
</button>
<div
class="form-message"
id="registerMessage"
>
</div>
</form>
<div class="auth-divider">
    <span>OR</span>
</div>
<div class="auth-footer">
    <span>
        Already have an account?
    </span>
    <a href="login.html">
        Login
    </a>
</div>
</div>
<a
href="../index.html"
class="back-home"
>
← Back to Workonnect
</a>
</section>
</main>
<script src="../assets/js/auth.js">
</script>
</body>
</html>
